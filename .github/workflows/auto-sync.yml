name: Auto Sync Verification

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify Push
        run: |
          echo "✅ Code synced to GitHub"
          git log -1 --oneline