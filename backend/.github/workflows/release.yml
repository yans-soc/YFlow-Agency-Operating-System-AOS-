name: Release

on:
    workflow_dispatch:
        inputs:
            version_type:
                description: 'Version type (patch/minor/major)'
                required: true
                default: 'patch'
                type: choice
                options:
                    - patch
                    - minor
                    - major
            changelog:
                description: 'Changelog summary'
                required: true
                type: string

env:
    APP_NAME: YFlow

jobs:
    prepare-release:
        runs-on: ubuntu-latest
        outputs:
            new_version: ${{ steps.version.outputs.new_version }}
            tag_name: ${{ steps.version.outputs.tag_name }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Calculate new version
              id: version
              run: |
                  CURRENT_VERSION=$(cat backend/composer.json | grep '"version"' | head -1 | awk -F'"' '{print $4}')
                  if [ -z "$CURRENT_VERSION" ]; then
                      CURRENT_VERSION="1.0.0"
                  fi
                  
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
                  
                  case "${{ github.event.inputs.version_type }}" in
                      major)
                          MAJOR=$((MAJOR + 1))
                          MINOR=0
                          PATCH=0
                          ;;
                      minor)
                          MINOR=$((MINOR + 1))
                          PATCH=0
                          ;;
                      patch)
                          PATCH=$((PATCH + 1))
                          ;;
                  esac
                  
                  NEW_VERSION="$MAJOR.$MINOR.$PATCH"
                  TAG_NAME="v$NEW_VERSION"
                  
                  echo "Current version: $CURRENT_VERSION"
                  echo "New version: $NEW_VERSION"
                  echo "Tag name: $TAG_NAME"
                  
                  echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
                  echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

            - name: Update version files
              run: |
                  NEW_VERSION="${{ steps.version.outputs.new_version }}"
                  
                  # Update backend version
                  cd backend
                  composer version $NEW_VERSION || echo "Version update skipped"
                  
                  # Create CHANGELOG entry
                  echo "## [$NEW_VERSION] - $(date +%Y-%m-%d)" >> ../CHANGELOG.md
                  echo "" >> ../CHANGELOG.md
                  echo "${{ github.event.inputs.changelog }}" >> ../CHANGELOG.md
                  echo "" >> ../CHANGELOG.md

            - name: Commit version bump
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore(release): bump version to ${{ steps.version.outputs.new_version }}"
                  file_pattern: "backend/composer.json CHANGELOG.md"
                  branch: main

            - name: Create Git tag
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"
                  git tag -a "${{ steps.version.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.tag_name }}"
                  git push origin "${{ steps.version.outputs.tag_name }}"

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag_name }}
                  name: "YFlow ${{ steps.version.outputs.tag_name }}"
                  body: |
                      ## What's Changed
                      
                      ${{ github.event.inputs.changelog }}
                      
                      ## Technical Details
                      
                      - Backend: Laravel 11 / PHP 8.4
                      - Frontend: React 18 / TypeScript
                      - Database: MySQL 8.0 / PostgreSQL 17
                      
                      ## Installation
                      
                      ```bash
                      git checkout ${{ steps.version.outputs.tag_name }}
                      cd backend && composer install
                      cd ../frontend && npm install && npm run build
                      ```
                  draft: false
                  prerelease: false
                  generate_release_notes: true

    notify-release:
        needs: prepare-release
        runs-on: ubuntu-latest

        steps:
            - name: Notify release
              run: |
                  echo "Release ${{ needs.prepare-release.outputs.tag_name }} created successfully!"
                  # Add notification webhook here:
                  # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
                  #     -H 'Content-type: application/json' \
                  #     --data "{\"text\":\"🚀 YFlow ${{ needs.prepare-release.outputs.tag_name }} released!\"}"

    update-docs:
        needs: prepare-release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Update API documentation
              run: |
                  echo "Updating API documentation for version ${{ needs.prepare-release.outputs.new_version }}"
                  # Add documentation update script here

            - name: Update deployment guide
              run: |
                  echo "Updating deployment guide"
                  # Add deployment guide update script here