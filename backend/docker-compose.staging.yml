services:
    # Laravel Application
    app:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '1000'
        image: yflow/app:staging
        restart: unless-stopped
        environment:
            APP_ENV: staging
            APP_DEBUG: 'false'
            APP_KEY: ${APP_KEY}
            APP_URL: ${APP_URL:-https://staging.yflow.local}
            
            # Database
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-yflow_staging}
            DB_USERNAME: ${DB_USERNAME:-yflow}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            
            # Cache & Queue
            CACHE_DRIVER: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
            
            # Redis
            REDIS_HOST: redis
            REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
            REDIS_PORT: 6379
            
            # Mail
            MAIL_MAILER: smtp
            MAIL_HOST: ${MAIL_HOST:-mailpit}
            MAIL_PORT: 1025
            MAIL_USERNAME: null
            MAIL_PASSWORD: null
            MAIL_ENCRYPTION: null
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@yflow.local}
            MAIL_FROM_NAME: "${MAIL_FROM_NAME:-YFlow Staging}"
            
            # Reverb (WebSockets)
            REVERB_APP_ID: ${REVERB_APP_ID}
            REVERB_APP_KEY: ${REVERB_APP_KEY}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET}
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8080}
        volumes:
            - .:/var/www/html:ro
            - ./storage:/var/www/html/storage
        networks:
            - yflow
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:80/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # PostgreSQL Database
    pgsql:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-yflow_staging}
            POSTGRES_USER: ${DB_USERNAME:-yflow}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgsql-data:/var/lib/postgresql/data
        networks:
            - yflow
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-yflow} -d ${DB_DATABASE:-yflow_staging}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Redis Cache & Queue
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        networks:
            - yflow
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Nginx Reverse Proxy
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-80}:80"
            - "${NGINX_SSL_PORT:-443}:443"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
            - ./storage:/var/www/html/storage
        networks:
            - yflow
        depends_on:
            - app

    # Reverb WebSocket Server
    reverb:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
        restart: unless-stopped
        command: php artisan reverb:start
        environment:
            APP_ENV: staging
            APP_KEY: ${APP_KEY}
            REVERB_APP_ID: ${REVERB_APP_ID}
            REVERB_APP_KEY: ${REVERB_APP_KEY}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET}
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8080}
        ports:
            - "${REVERB_SERVER_PORT:-8080}:8080"
        networks:
            - yflow
        depends_on:
            - redis

    # Mail Capture (Development/Staging Only)
    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - "${MAILPIT_PORT:-8025}:8025"
            - "1025:1025"
        networks:
            - yflow

networks:
    yflow:
        driver: bridge

volumes:
    pgsql-data:
        driver: local
    redis-data:
        driver: local